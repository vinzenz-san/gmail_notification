<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <script src="browser-polyfill.min.js"></script>
    <script src="theme.js"></script>
    <style>
      body {
        width: 380px;
        padding: 16px 18px 20px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 14px;
      }
      section {
        margin-bottom: 18px;
      }
      section h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--hint);
        margin: 0 0 8px;
      }
      button.primary {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--control-bg);
        color: var(--text);
        cursor: pointer;
      }
      button.primary:hover {
        background: var(--hover-bg);
      }
      #accounts-status {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--hint);
      }
      .account-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        font-size: 13px;
      }
      .reorder-buttons {
        display: inline-flex;
        gap: 2px;
        width: 40px;
        flex: 0 0 auto;
      }
      .reorder-buttons button {
        font: inherit;
        line-height: 1;
        padding: 2px 5px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--control-bg);
        color: var(--text);
        cursor: pointer;
      }
      .reorder-buttons button:hover:not(:disabled) {
        background: var(--hover-bg);
      }
      .reorder-buttons button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
      }
      .toggle-row label {
        font-size: 13px;
      }
      select {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--control-bg);
        color: var(--text);
      }
      p.hint {
        margin: 6px 0 0;
        color: var(--hint);
        font-size: 11.5px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle"></h1>

    <section>
      <h2 data-i18n="optionsAccountsHeading"></h2>
      <button id="detect-btn" class="primary" data-i18n="optionsDetectAccounts"></button>
      <p id="accounts-status"></p>
      <div id="accounts-list"></div>
    </section>

    <section>
      <h2 data-i18n="optionsNotificationsHeading"></h2>
      <div class="toggle-row">
        <label for="toggle-notifications" data-i18n="optionsToggleNotifications"></label>
        <input type="checkbox" id="toggle-notifications" />
      </div>
      <div class="toggle-row">
        <label for="toggle-sound" data-i18n="optionsToggleSound"></label>
        <input type="checkbox" id="toggle-sound" />
      </div>
      <div class="toggle-row">
        <label for="toggle-badge" data-i18n="optionsToggleBadge"></label>
        <input type="checkbox" id="toggle-badge" />
      </div>
    </section>

    <section>
      <h2 data-i18n="optionsAppearanceHeading"></h2>
      <div class="toggle-row">
        <label for="theme-select" data-i18n="optionsThemeLabel"></label>
        <select id="theme-select">
          <option value="system" data-i18n="optionsThemeSystem"></option>
          <option value="light" data-i18n="optionsThemeLight"></option>
          <option value="dark" data-i18n="optionsThemeDark"></option>
        </select>
      </div>
    </section>

    <p class="hint" data-i18n="optionsFooterHint"></p>

    <script src="options.js"></script>
  </body>
</html>
